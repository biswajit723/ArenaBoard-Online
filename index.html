/* ============ derived stats (recomputed from history) ============ */
var D=null;
function derive(){
  var ps={},ts={};
  S.players.forEach(function(p){ps[p.id]={rating:1000,m:0,kills:0,booyah:0,top3:0,posSum:0,pts:0,maxK:0,hist:[]}});
  S.teams.forEach(function(x){ts[x.id]={m:0,kills:0,booyah:0,pts:0}});
  var done=S.matches.filter(function(m){return m.status==='completed'&&m.results&&m.results.length}).sort(function(a,b){return a.start-b.start});
  done.forEach(function(m){
    var rows=m.results.map(function(r){var e=byId(m.entries,r.eid);if(!e)return null;var pl=entryPlayers(e).filter(function(id){return ps[id]});
      var R=pl.length?pl.reduce(function(a,id){return a+ps[id].rating},0)/pl.length:1000;return {r:r,e:e,pl:pl,R:R}}).filter(Boolean);
    var n=rows.length;
    rows.forEach(function(x){
      var sum=0;rows.forEach(function(y){if(y===x)return;var S1=x.r.pos<y.r.pos?1:x.r.pos>y.r.pos?0:.5;var E=1/(1+Math.pow(10,(y.R-x.R)/400));sum+=S1-E});
      x.delta=n>1?32*sum/(n-1)*Math.min(2,Math.sqrt(n/4)):0;
    });
    rows.forEach(function(x){
      var seasonOk=(m.season||1)===S.settings.season;
      x.pl.forEach(function(id){var s=ps[id];s.rating+=x.delta;s.m++;s.posSum+=x.r.pos;if(x.r.pos===1)s.booyah++;if(x.r.pos<=3)s.top3++;
        var k=x.e.k==='p'?x.r.kills:((x.r.mk&&x.r.mk[id])||0);s.kills+=k;s.maxK=Math.max(s.maxK,k);if(seasonOk)s.pts+=x.r.pts;s.hist.push({m:m.id,k:k,pos:x.r.pos})});
      if(x.e.k==='t'&&ts[x.e.id]){var q=ts[x.e.id];q.m++;q.kills+=x.r.kills;if(x.r.pos===1)q.booyah++;if(seasonOk)q.pts+=x.r.pts}
    });
  });
  for(var id in ps)ps[id].rating=Math.round(ps[id].rating);
  D={ps:ps,ts:ts};return D;
}

function canJoin(m){
  var p=me();if(!p)return t('needProfile');if(p.banned)return t('banned');
  if(m.tid)return t('viaTourney');
  if(matchStatus(m)!=='upcoming')return t('started');
  var ref=myEntryRef(m.mode);
  if(!ref)return t('needTeam');
  if(m.mode!=='solo'){var tm=TM(ref.id);if(tm.captain!==p.id)return t('needCaptain');if(tm.members.length<need(m.mode))return t('needMembers',{n:need(m.mode)});if(tm.members.some(function(id){var x=P(id);return x&&x.banned}))return t('memberBanned');
    if(tm.members.some(function(id){return inMatch(m,id)}))return t('already')}
  else if(inMatch(m,p.id))return t('already');
  if(m.entries.length>=m.slots)return t('full');
  var r=m.mode==='solo'?pst(p.id).rating:Math.round(TM(ref.id).members.reduce(function(a,id){return a+pst(id).rating},0)/TM(ref.id).members.length);
  if((m.minR&&r<m.minR)||(m.maxR&&r>m.maxR))return t('ratingRange',{a:m.minR||0,b:m.maxR||'∞',r:r});
  return null;
}

/* ============ results: scoring, anomaly flags, parsing ============ */
function publishResults(m,rows){
  var seen={};for(var i=0;i<rows.length;i++){if(seen[rows[i].pos]){toast(t('posDup'));return Promise.resolve(false)}seen[rows[i].pos]=1}
  derive();
  var flags=[];
  rows.forEach(function(r){
    r.pts=(m.pp[r.pos-1]||0)+r.kills*m.killPts;
    var e=byId(m.entries,r.eid);
    entryPlayers(e).forEach(function(pid){
      var p=P(pid);if(!p)return;var s=pst(pid);var k=e.k==='p'?r.kills:((r.mk&&r.mk[pid])||0);
      var avg=s.m>=3?s.kills/s.m:2;
      var kf=+cfg('killFlag',10)||10;if(k>=Math.min(8,kf)&&k>Math.max(kf,avg*3))flags.push({pid:pid,code:'f_kills',v:k});
      if(p.banned)flags.push({pid:pid,code:'f_banned'});
      if(S.reports.some(function(x){return x.target===pid&&x.status==='open'}))flags.push({pid:pid,code:'f_reports'});
    });
  });
  var payload=rows.map(function(r){return {entry_id:r.eid,pos:r.pos,kills:r.kills,member_kills:r.mk||{},pts:r.pts}});

function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var d=[];for(var i=0;i<=m;i++){d[i]=[i]}for(var j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function sim(a,b){var mx=Math.max(a.length,b.length);return mx?1-lev(a,b)/mx:0}
/* Parse OCR / pasted text into {pid:{pos?,kills}} using fuzzy IGN matching */
function parseResultText(m,text){
  var lines=String(text).split(/\n+/).map(function(l){return l.trim()}).filter(Boolean);
  var cands=[];m.entries.forEach(function(e){entryPlayers(e).forEach(function(pid){var p=P(pid);if(p)cands.push({pid:pid,eid:e.id,n:norm(p.ign)})})});
  var out={},order=0,lastPos=null;
  lines.forEach(function(line){
    var toks=line.split(/\s+/),best=null,bs=0,bi=-1;
    for(var i=0;i<toks.length;i++){for(var w=1;w<=3&&i+w<=toks.length;w++){var chunk=norm(toks.slice(i,i+w).join(''));if(chunk.length<3)continue;
      cands.forEach(function(c){var s=sim(chunk,c.n);if(s>bs){bs=s;best=c;bi=i}})}}
    var nums=(line.match(/\d+/g)||[]).map(Number);
    var lead=line.match(/^\s*#?(\d{1,2})\b/);
    if(!best||bs<0.72){if(lead&&nums.length===1)lastPos=+lead[1];return}
    if(out[best.pid])return;
    var after=line.split(/\s+/).slice(bi+1).join(' ').match(/\d+/g)||[];
    var kills=after.length?+after[0]:0;if(kills>60)kills=0;
    var pos=lead?+lead[1]:lastPos;
    order++;out[best.pid]={eid:best.eid,kills:kills,pos:pos||null,order:order};
  });
  return out;
}

function applyParsed(m,parsed){
  var n=0,order={};
  Object.keys(parsed).forEach(function(pid){var x=parsed[pid];var tr=document.querySelector('tr[data-eid="'+x.eid+'"]');if(!tr)return;
    var e=byId(m.entries,x.eid);
    if(e.k==='p'){tr.querySelector('.rk').value=x.kills}else{var inp=tr.querySelector('.rmk[data-pid="'+pid+'"]');if(inp)inp.value=x.kills}
    var posIn=tr.querySelector('.rpos');
    if(x.pos)posIn.value=x.pos;else if(!order[x.eid]){order[x.eid]=x.order}
    n++;});
  // entries without explicit pos: rank by order of first appearance
  var noPos=Object.keys(order).sort(function(a,b){return order[a]-order[b]});
  var used={};document.querySelectorAll('.rpos').forEach(function(i){if(i.value)used[i.value]=1});
  var next=1;noPos.forEach(function(eid){var tr=document.querySelector('tr[data-eid="'+eid+'"] .rpos');if(tr&&!tr.value){while(used[next])next++;tr.value=next;used[next]=1}});
  toast(t('filled',{n:n}));
}
function collectResults(m){
  var rows=[],missing=[];
  document.querySelectorAll('tr[data-eid]').forEach(function(tr){
    var eid=tr.getAttribute('data-eid'),e=byId(m.entries,eid),pos=+tr.querySelector('.rpos').value;
    if(!pos){missing.push(eid);return}
    var r={eid:eid,pos:pos,kills:0};
    if(e.k==='p')r.kills=Math.max(0,+(tr.querySelector('.rk').value||0));
    else{r.mk={};tr.querySelectorAll('.rmk').forEach(function(i){var k=Math.max(0,+(i.value||0));r.mk[i.getAttribute('data-pid')]=k;r.kills+=k})}
    rows.push(r);
  });
  // unplaced entries go to the bottom in entry order
  var maxPos=rows.reduce(function(a,r){return Math.max(a,r.pos)},0);
  missing.forEach(function(eid){rows.push({eid:eid,pos:++maxPos,kills:0,mk:{}})});
  return rows;
}

var FRAMES=[[1,'',''],[5,'#CD7F32','Bronze'],[10,'#C0C0C0','Silver'],[15,'#FFD700','Gold'],[20,'#7DF9FF','Diamond'],[30,'#FF4500','Inferno']];
function istDay(ts){return new Date((ts||now())+5.5*36e5).toISOString().slice(0,10)}
function weekStart(){var d=new Date(now()+5.5*36e5);var wd=(d.getUTCDay()+6)%7;d.setUTCHours(0,0,0,0);return d.getTime()-wd*864e5-5.5*36e5}
function myCheckins(pid){return (S.checkins||[]).filter(function(c){return c.pid===pid})}
function streakOf(pid){var days={};myCheckins(pid).forEach(function(c){days[c.day]=1});var n=0,t=now();if(!days[istDay(t)])t-=864e5;while(days[istDay(t)]){n++;t-=864e5}return n}
function mvpOf(m){var c={};(S.votes||[]).forEach(function(v){if(v.matchId===m.id)c[v.target]=(c[v.target]||0)+1});var best=null,bn=0;Object.keys(c).forEach(function(k){if(c[k]>bn){bn=c[k];best=k}});return best?{pid:best,votes:bn}:null}
function mvpCount(pid){var n=0;S.matches.forEach(function(m){if(m.status==='completed'){var x=mvpOf(m);if(x&&x.pid===pid)n++}});return n}
function weekProgress(pid,from,to){var s=pst(pid),r={m:0,k:0,top3:0,ci:0};
  s.hist.forEach(function(h){var m=M(h.m);if(!m||m.start<from||m.start>=to)return;r.m++;r.k+=h.k;if(h.pos<=3)r.top3++});
  myCheckins(pid).forEach(function(c){var t=Date.parse(c.day+'T00:00:00+05:30');if(t>=from&&t<to)r.ci++});return r}
function missionsFor(pid){var ws=weekStart(),p=weekProgress(pid,ws,ws+7*864e5);
  return [{k:'m_play',cur:p.m,goal:3,xp:50},{k:'m_kills',cur:p.k,goal:10,xp:50},{k:'m_top3',cur:p.top3,goal:1,xp:50},{k:'m_check',cur:p.ci,goal:5,xp:50}]}
function pastMissionXP(pid){var first=Infinity;pst(pid).hist.forEach(function(h){var m=M(h.m);if(m)first=Math.min(first,m.start)});myCheckins(pid).forEach(function(c){first=Math.min(first,Date.parse(c.day+'T00:00:00+05:30'))});
  if(first===Infinity)return 0;var xp=0,ws=weekStart();for(var w=ws;w+7*864e5>first;w-=7*864e5){var p=weekProgress(pid,w,w+7*864e5);xp+=(p.m>=3?50:0)+(p.k>=10?50:0)+(p.top3>=1?50:0)+(p.ci>=5?50:0)}return xp}
function xpOf(pid){var s=pst(pid);return s.m*20+s.kills*5+s.booyah*50+s.top3*15+myCheckins(pid).length*10+mvpCount(pid)*40+pastMissionXP(pid)+bountyCount(pid)*100}
function levelOf(xp){var lv=Math.floor(Math.sqrt(xp/40))+1,cur=Math.pow(lv-1,2)*40,nx=Math.pow(lv,2)*40;return {lv:lv,prog:(xp-cur)/(nx-cur),next:nx-xp}}

function confetti(n){try{var c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90';document.body.appendChild(c);
  var w=c.width=innerWidth,h=c.height=innerHeight,x=c.getContext('2d'),cols=['#FF7A1A','#FFB020','#2BD67B','#5AA9FF','#B57CFF','#FF5A5F','#fff'],P=[];
  for(var i=0;i<(n||160);i++)P.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:4+Math.random()*5,c:cols[i%cols.length],a:Math.random()*6,s:(Math.random()-.5)*.3});
  var t0=performance.now();(function f(t){x.clearRect(0,0,w,h);P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});
    if(t-t0<2800)requestAnimationFrame(f);else c.remove()})(t0)}catch(e){}}
function fanfare(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var a=new A(),t=a.currentTime;[523,659,784,1047,784,1047].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.12);g.gain.exponentialRampToValueAtTime(.12,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.22);o.connect(g);g.connect(a.destination);o.start(t+i*.12);o.stop(t+i*.12+.25)})}catch(e){}}

function wrapText(x,t,X,Y,maxW,lh){var w=String(t).split(' '),line='',y=Y;for(var i=0;i<w.length;i++){var test=line+w[i]+' ';if(x.measureText(test).width>maxW&&line){x.fillText(line,X,y);line=w[i]+' ';y+=lh}else line=test}x.fillText(line,X,y)}
function roundRect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}

function locNorm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function locSearch(q){q=locNorm(q);if(q.length<2)return [];var out=[],seen={};
  function add(r,score){var k=r.st+'|'+(r.d||'')+'|'+(r.c||'');if(seen[k])return;seen[k]=1;r.s=score;out.push(r)}
  function sc(name){var n=locNorm(name);if(n===q)return 0;if(n.indexOf(q)===0)return 1;if(n.indexOf(' '+q)>=0)return 2;if(n.indexOf(q)>=0)return 3;return -1}
  Object.keys(INDIA_ALIAS).forEach(function(k){var v=sc(k);if(v>=0&&v<2)add({st:INDIA_ALIAS[k][0],d:INDIA_ALIAS[k][1],why:k},v)});

var LAST_HTML='',LAST_VIEW='',MODAL_HTML='',MODAL_SRC='',MODAL_SEQ=0,PENDING_RR=false;
function isTyping(){var a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='radio'&&a.type!=='button')}
function paintApp(html){var changedView=view!==LAST_VIEW;
  if(!changedView&&html===LAST_HTML)return;           // nothing changed: keep the page exactly as it is
  var y=window.scrollY;$('app').innerHTML=html;LAST_HTML=html;
  if(changedView){LAST_VIEW=view;window.scrollTo(0,0)}else if(Math.abs(window.scrollY-y)>2)window.scrollTo(0,y)}
var LAST_TOUCH=0,RR_TIMER=null;document.addEventListener('pointerdown',function(){LAST_TOUCH=Date.now()},true);
function smoothRerender(openM,openT,hasModal){
  if(isTyping()){PENDING_RR=true;return}
  var since=Date.now()-LAST_TOUCH;if(since<1200){clearTimeout(RR_TIMER);RR_TIMER=setTimeout(rerender,1250-since);return}             // never wipe what the player is typing
  var mo=document.querySelector('.modal'),ms=mo?mo.scrollTop:0;
  render();

  var m2=document.querySelector('.modal');if(m2&&ms)m2.scrollTop=ms}

function seasonStats(season){var ps={},tsx={},mv={},nm=0,who={};
  S.matches.forEach(function(m){if(m.status!=='completed'||!m.results.length||(m.season||1)!==season)return;nm++;
    m.results.forEach(function(r){var e=byId(m.entries,r.eid);if(!e)return;entryPlayers(e).forEach(function(id){var s=ps[id]=ps[id]||{pts:0,kills:0,booyah:0,m:0};s.m++;s.pts+=r.pts;s.kills+=e.k==='p'?r.kills:((r.mk&&r.mk[id])||0);if(r.pos===1)s.booyah++;who[id]=1});
      if(e.k==='t'){var q=tsx[e.ref]=tsx[e.ref]||{pts:0,booyah:0};q.pts+=r.pts;if(r.pos===1)q.booyah++}});
    var x=mvpOf(m);if(x)mv[x.pid]=(mv[x.pid]||0)+1});
  function best(o,f,tie){return Object.keys(o).filter(function(id){var p=P(id);return p&&p.role!=='admin'&&!p.banned}).sort(function(a,b){return (f(o[b])-f(o[a]))||((tie?tie(o[b])-tie(o[a]):0))})}
  var top=best(ps,function(s){return s.pts},function(s){return s.booyah*1000+s.kills}).slice(0,3).map(function(id){return {ign:P(id).ign,pts:ps[id].pts,booyah:ps[id].booyah,kills:ps[id].kills}});
  var fr=best(ps,function(s){return s.kills})[0],mvp=Object.keys(mv).filter(function(id){return P(id)}).sort(function(a,b){return mv[b]-mv[a]})[0];
  var tm=Object.keys(tsx).filter(function(id){return TM(id)}).sort(function(a,b){return (tsx[b].pts-tsx[a].pts)||(tsx[b].booyah-tsx[a].booyah)})[0];
  return {season:season,top:top,fragger:fr&&ps[fr].kills?{ign:P(fr).ign,kills:ps[fr].kills}:null,mvp:mvp?{ign:P(mvp).ign,n:mv[mvp]}:null,
    team:tm?{name:TM(tm).name+' ['+TM(tm).tag+']',pts:tsx[tm].pts}:null,players:Object.keys(who).length,matches:nm}}

/* ---------- talking to the Edge Function ---------- */
async function ytCall(a,body,headers){
  var r=await sb.functions.invoke('yt-ai?a='+a,{body:body,headers:headers||{}});
  if(r.error){var msg=r.error.message||'error';try{if(r.error.context&&r.error.context.json){var j=await r.error.context.json();msg=j.error||msg}}catch(e){}
    if(msg==='yt_limit')msg=t('ytLimit');else if(msg==='yt_busy')msg=t('ytBusy');else if(/Failed to send|fetch/i.test(msg))msg=t('ytNoFn');throw new Error(msg)}
  return r.data}
function ytStage(s,p){YT.busy=s;if(p!=null)YT.prog=p;var a=$('yt_stage'),b=$('yt_bar');if(a&&b){a.textContent=s;b.style.width=Math.round(YT.prog*100)+'%'}else if(view==='yt_an')render()}
function ytId(u){var m=String(u||'').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:''}
var ytSleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

async function ytGo(){if(YT.busy)return;if(!ytAllowed())return;
  if(YT.left===0){toast('⚠ '+t('ytLimit'));return}
  var base={lang:YT.lang,game:YT.game,note:YT.note,title:YT.title,channel:brandName()};
  if(YT.src==='url'){if(!ytId(YT.url)){toast('⚠ '+t('ytBadUrl'));return}}
  else if(!YT.file){toast('⚠ '+t('ytPickFile'));return}
  else if(YT.file.size>2147483648){toast('⚠ '+t('ytTooBig'));return}
  try{
    var job;
    if(YT.src==='url'){ytStage(t('ytS_send'),0.05);job=await ytCall('analyze',Object.assign({src:'url',url:YT.url},base))}
    else{
      var f=YT.file;ytStage(t('ytS_up')+' 0%',0.01);
      var st=await ytCall('start',{size:f.size,mime:f.type||'video/mp4',name:f.name});
      var size=st.chunk||5242880,off=0,info=null;
      while(off<f.size){var end=Math.min(f.size,off+size),fin=end>=f.size,tries=0,res;
        for(;;){try{res=await ytCall('chunk',f.slice(off,end),{'x-up-url':st.url,'x-up-off':String(off),'x-up-final':fin?'1':'0'});break}catch(e){if(++tries>=3)throw e;await ytSleep(1500*tries)}}
        off=end;if(fin)info=res.file;ytStage(t('ytS_up')+' '+Math.round(off/f.size*100)+'% · '+mb(off)+' / '+mb(f.size),0.05+0.6*off/f.size)}
      if(!info||!info.uri)throw new Error(t('ytUpFail'));
      var waited=0;while(info.state!=='ACTIVE'){ytStage(t('ytS_proc'),0.68);await ytSleep(4000);waited+=4;var s=await ytCall('state',{name:info.name});info.state=s.state;if(s.state==='FAILED')throw new Error(t('ytUpFail'));if(waited>900)throw new Error(t('ytTimeout'))}
      ytStage(t('ytS_send'),0.72);job=await ytCall('analyze',Object.assign({src:'file',uri:info.uri,name:info.name,mime:info.mime||f.type,fname:f.name},base))}
    YT.job=job.job;ytSave();
    var t0=Date.now(),row=null;
    while(Date.now()-t0<330000){var sec=Math.round((Date.now()-t0)/1000);ytStage(t('ytS_ai')+' '+sec+'s',Math.min(0.97,0.75+sec/240));await ytSleep(3500);
      var q=await sb.from('yt_jobs').select('*').eq('id',job.job);row=(q.data||[])[0];if(row&&row.status!=='working')break}
    if(!row||row.status==='working')throw new Error(t('ytTimeout'));
    if(row.status==='error')throw new Error(row.error||'AI error');
    ytUseResult(row.result,{title:job.title||row.title});YT.busy='';YT.prog=0;YT.left=null;YT.jobs=null;render();toast('✨ '+t('ytDone'));
    setTimeout(function(){var c=document.querySelector('.ytv .card:nth-of-type(3)');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})},80);
  }catch(e){YT.busy='';YT.prog=0;YT.left=null;render();toast('⚠ '+(e.message||e))}}

function ytImg(src){if(!src)return null;var im=YT_IMGS[src];if(!im){im=new Image();im.onload=function(){ytDraw()};im.src=src;YT_IMGS[src]=im}return im.complete&&im.naturalWidth?im:null}

  if(!YT.frames.length&&!YT._autoFr&&((YT.src==='url'&&ytId(YT.url))||YT.file)){YT._autoFr=1;ytFrames()}}}
function fitFont(x,txt,max,maxW,fam){var s=max;x.font=s+'px '+fam;while(s>28&&x.measureText(txt).width>maxW){s-=4;x.font=s+'px '+fam}return s}
function splitLines(txt){var w=String(txt||'').trim().split(/\s+/);if(w.length<2||txt.length<10)return [txt];var best=null;for(var i=1;i<w.length;i++){var a=w.slice(0,i).join(' '),b=w.slice(i).join(' '),m=Math.max(a.length,b.length);if(!best||m<best[2])best=[a,b,m]}return [best[0],best[1]]}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;function c(v){return Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)))}return 'rgb('+c(r)+','+c(g)+','+c(b)+')'}
/* which side of the picture is calmer (less detail) → put the title there */
function calmSide(im){try{var c=document.createElement('canvas');c.width=64;c.height=36;var x=c.getContext('2d');x.drawImage(im,0,0,64,36);var d=x.getImageData(0,0,64,36).data;
  function busy(x0,x1,y0,y1){var s=0,n=0;for(var y=y0;y<y1;y++)for(var xx=x0+1;xx<x1;xx++){var i=(y*64+xx)*4,j=i-4;s+=Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2]);n++}return s/n}
  var L=busy(0,26,0,36),R=busy(38,64,0,36);return L<=R?'left':'right'}catch(e){return 'left'}}
function thSide(im){var s=YT.th.side;if(s&&s!=='auto')return s;var d=ytAI().design;if(d&&YT.frames.length&&YT.th.img<(YT.aiN||0)&&d.text_side)return d.text_side;if(!im)return 'left';if(im._side==null)im._side=calmSide(im);return im._side}
function ytDraw(){var c=$('yt_cv');if(!c)return;var x=c.getContext('2d'),W=1280,H=720,th=YT.th,col=thHex(),st=th.tstyle||'3d';

var VAPID_PUBLIC='BPMx63PABTNBGkXXOn6rYBHUI-qppgfXrU2XCPEyGuCRkbBpP4Nody61YpbKZ610la99z9eww1o_TsBeQgkV2qM';
function pushOk(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function pushGranted(){try{return Notification.permission==='granted'}catch(e){return false}}
function b64u(s){var p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function enablePush(){if(!pushOk()){toast(t('pushNo'));return}
  var perm=await Notification.requestPermission();if(perm!=='granted'){toast(t('pushDenied'));return}
  var reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  var j=sub.toJSON();await rpc('save_push_sub',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});PREF.pushOn=1;savePref();toast(t('pushOnOk'));render()}
async function pushUnsub(){try{var reg=await navigator.serviceWorker.getRegistration();var s2=reg&&await reg.pushManager.getSubscription();if(s2&&sb)await sb.rpc('remove_push_sub',{p_endpoint:s2.endpoint})}catch(e){}}
function pushBanner(){if(!me()||!pushOk()||pushGranted()&&PREF.pushOn||PREF.pushDismiss)return '';
  return '<div class="card row between" style="border-color:var(--blue)"><span class="small b">'+t('pushBanner')+'</span><div class="row"><button class="btn sm" data-a="pushOn">'+t('turnOn')+'</button><button class="btn sm sec" data-a="pushDismiss">✕</button></div></div>'}
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}catch(e){return false}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;var typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!typing&&!$('layer').innerHTML)render()});
window.addEventListener('appinstalled',function(){deferredInstall=null;toast(t('installedOk'));render()});
(function(){try{var h=location.hostname;if('serviceWorker' in navigator&&(location.protocol==='https:'||h==='localhost'||h==='127.0.0.1'))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}})();
function installCard(){
  if(isStandalone())return '<div class="card small"><b>📲 '+t('runningAsApp')+'</b></div>';
  return '<div class="card st"><b class="small">📲 '+t('install')+'</b>'+(deferredInstall?'<button class="btn" data-a="installApp">📲 '+t('installApp')+'</button>':'')+
   '<p class="small muted">'+t('installAndroid')+'<br>'+t('installIos')+'</p><p class="tiny muted">'+t('onlineNote')+'</p></div>';
}
async function boot(){
  NET='connecting';render();
  try{
    BOOT_ERR='';try{await libLoad()}catch(e){throw new Error('LIB: could not load the Supabase library from cdn.jsdelivr.net / unpkg.com (blocked network, ad-blocker or strict tracking protection?)')}
    if(!sb)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    var r=await sb.auth.getSession();if(r.error)throw new Error('AUTH: '+(r.error.message||r.error));
    SESSION=r.data.session;
    if(SESSION){try{await pull()}catch(e){throw new Error('DATA: '+((e&&(e.message||e.code))||e)+(e&&e.hint?' ('+e.hint+')':''))}}
    NET='ok';try{render()}catch(e){throw new Error('APP: '+(e&&e.message)+' @ '+String(e&&e.stack||'').split('\n')[1])}
    if(!boot.wired){boot.wired=1;
      sb.auth.onAuthStateChange(function(evt,sess){var was=SESSION&&SESSION.user.id;SESSION=sess;if(sess&&sess.user.id!==was){pull().then(function(){render();subscribe()}).catch(function(){NET='error';render()})}else if(!sess){render()}});
      setInterval(function(){if(SESSION&&!document.hidden)schedulePull()},60000);
    }
    if(SESSION)subscribe();
    if(isAdmin())runTemplates().then(function(n){if(n)schedulePull()}).catch(function(){});
  }catch(e){console.error(e);BOOT_ERR=String((e&&e.message)||e).slice(0,400);NET='error';render()}
}
function subscribe(){
  if(channel||!sb)return;
  try{channel=sb.channel('arena-all').on('postgres_changes',{event:'*',schema:'public'},function(pl){if(pl&&pl.table==='chat'){var cm=(pl.new&&pl.new.match_id)||(pl.old&&pl.old.match_id);if(openMatchId&&(!cm||cm===openMatchId))loadChat(openMatchId);return}schedulePull()}).subscribe()}catch(e){}
}
boot();
setInterval(tick,1000);
})();
</script>
