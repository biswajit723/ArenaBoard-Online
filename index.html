<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0E1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ArenaBoard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<title>ArenaBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;800&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1117;--card:#161B24;--card2:#1D2430;--line:#283141;--ink:#EEF2F7;--muted:#8E9AAD;--acc:#FF7A1A;--acc2:#FFB020;--accBg:#2D1F12;--green:#2BD67B;--greenBg:#12291D;--red:#FF5A5F;--redBg:#2E1618;--blue:#5AA9FF;--blueBg:#13233A;--purple:#B57CFF;--purpleBg:#24183A}
[data-theme=light]{--bg:#F4F6FA;--card:#FFFFFF;--card2:#F1F4F9;--line:#E2E7EF;--ink:#141A23;--muted:#667385;--acc:#E8620A;--acc2:#C98500;--accBg:#FFF0E3;--green:#12955A;--greenBg:#E4F6EC;--red:#D23B42;--redBg:#FDECEE;--blue:#2C6FD1;--blueBg:#E8F0FC;--purple:#7B45D6;--purpleBg:#F1E9FD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Bengali",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:16px 16px 100px;min-height:100vh}
h1,h2,h3,.disp{font-family:Rajdhani,Inter,"Noto Sans Bengali",sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:28px;font-weight:700}h2{font-size:20px;font-weight:700}h3{font-size:16.5px;font-weight:700}
p{margin:0}.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}.st{display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.click{cursor:pointer}.card.click:active{transform:scale(.995)}
.btn{border:0;border-radius:11px;min-height:42px;padding:0 14px;background:var(--acc);color:#fff;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--green);color:#06150D}.btn.no{background:var(--redBg);color:var(--red)}.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}.btn.block{width:100%}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--card2);color:var(--muted);white-space:nowrap}
.t-acc{background:var(--accBg);color:var(--acc)}.t-g{background:var(--greenBg);color:var(--green)}.t-r{background:var(--redBg);color:var(--red)}.t-b{background:var(--blueBg);color:var(--blue)}.t-p{background:var(--purpleBg);color:var(--purple)}
.hero{border-radius:18px;padding:16px;background:radial-gradient(120% 140% at 0% 0%,#FF7A1A 0%,#B33A0B 45%,#2A1208 100%);color:#fff;border:0}
.hero .lbl{opacity:.8;font-size:12px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-family:Rajdhani,sans-serif;font-size:22px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:80px;resize:vertical}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .in{display:flex;max-width:760px;width:100%}
.tab{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}.tab.on{color:var(--acc)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:800}
.lr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.lr:last-child{border-bottom:0}
.rank{width:30px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:Rajdhani,sans-serif;font-size:16px;flex:none}
.r1{background:linear-gradient(135deg,#FFD54A,#E39B00);color:#2A1A00}.r2{background:linear-gradient(135deg,#E5E9F0,#9AA5B5);color:#1A1F27}.r3{background:linear-gradient(135deg,#F0A36B,#A0522D);color:#2A1206}
.av{width:36px;height:36px;border-radius:11px;background:var(--accBg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.room{border:1.5px dashed var(--acc);border-radius:14px;padding:12px;background:var(--accBg)}
.room code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:70;max-width:92vw;text-align:center}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px}
table.rt td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.rt input{padding:6px;min-width:0}
.cd{font-family:Rajdhani,sans-serif;font-weight:700}
.live{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.45}}
.hidden{display:none!important}
a{color:var(--acc)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
</style>
</head>

function publishResults(m,rows){
  var seen={};for(var i=0;i<rows.length;i++){if(seen[rows[i].pos]){toast(t('posDup'));return Promise.resolve(false)}seen[rows[i].pos]=1}
  derive();
  var flags=[];
  rows.forEach(function(r){
    r.pts=(m.pp[r.pos-1]||0)+r.kills*m.killPts;
    var e=byId(m.entries,r.eid);
    entryPlayers(e).forEach(function(pid){
      var p=P(pid);if(!p)return;var s=pst(pid);var k=e.k==='p'?r.kills:((r.mk&&r.mk[pid])||0);
      var avg=s.m>=3?s.kills/s.m:2;
      var kf=+cfg('killFlag',10)||10;if(k>=Math.min(8,kf)&&k>Math.max(kf,avg*3))flags.push({pid:pid,code:'f_kills',v:k});
      if(p.banned)flags.push({pid:pid,code:'f_banned'});
      if(S.reports.some(function(x){return x.target===pid&&x.status==='open'}))flags.push({pid:pid,code:'f_reports'});
    });
  });
  var payload=rows.map(function(r){return {entry_id:r.eid,pos:r.pos,kills:r.kills,member_kills:r.mk||{},pts:r.pts}});
  return run(function(){return rpc('publish_results',{p_match:m.id,p_rows:payload,p_flags:flags})},t('published'));
}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var d=[];for(var i=0;i<=m;i++){d[i]=[i]}for(var j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function sim(a,b){var mx=Math.max(a.length,b.length);return mx?1-lev(a,b)/mx:0}
/* Parse OCR / pasted text into {pid:{pos?,kills}} using fuzzy IGN matching */
function parseResultText(m,text){
  var lines=String(text).split(/\n+/).map(function(l){return l.trim()}).filter(Boolean);
  var cands=[];m.entries.forEach(function(e){entryPlayers(e).forEach(function(pid){var p=P(pid);if(p)cands.push({pid:pid,eid:e.id,n:norm(p.ign)})})});
  var out={},order=0,lastPos=null;
  lines.forEach(function(line){
    var toks=line.split(/\s+/),best=null,bs=0,bi=-1;
    for(var i=0;i<toks.length;i++){for(var w=1;w<=3&&i+w<=toks.length;w++){var chunk=norm(toks.slice(i,i+w).join(''));if(chunk.length<3)continue;
      cands.forEach(function(c){var s=sim(chunk,c.n);if(s>bs){bs=s;best=c;bi=i}})}}
    var nums=(line.match(/\d+/g)||[]).map(Number);
    var lead=line.match(/^\s*#?(\d{1,2})\b/);
    if(!best||bs<0.72){if(lead&&nums.length===1)lastPos=+lead[1];return}
    if(out[best.pid])return;
    var after=line.split(/\s+/).slice(bi+1).join(' ').match(/\d+/g)||[];
    var kills=after.length?+after[0]:0;if(kills>60)kills=0;
    var pos=lead?+lead[1]:lastPos;
    order++;out[best.pid]={eid:best.eid,kills:kills,pos:pos||null,order:order};
  });
  return out;
}

function applyParsed(m,parsed){
  var n=0,order={};
  Object.keys(parsed).forEach(function(pid){var x=parsed[pid];var tr=document.querySelector('tr[data-eid="'+x.eid+'"]');if(!tr)return;
    var e=byId(m.entries,x.eid);
    if(e.k==='p'){tr.querySelector('.rk').value=x.kills}else{var inp=tr.querySelector('.rmk[data-pid="'+pid+'"]');if(inp)inp.value=x.kills}
    var posIn=tr.querySelector('.rpos');
    if(x.pos)posIn.value=x.pos;else if(!order[x.eid]){order[x.eid]=x.order}
    n++;});
  // entries without explicit pos: rank by order of first appearance
  var noPos=Object.keys(order).sort(function(a,b){return order[a]-order[b]});
  var used={};document.querySelectorAll('.rpos').forEach(function(i){if(i.value)used[i.value]=1});
  var next=1;noPos.forEach(function(eid){var tr=document.querySelector('tr[data-eid="'+eid+'"] .rpos');if(tr&&!tr.value){while(used[next])next++;tr.value=next;used[next]=1}});
  toast(t('filled',{n:n}));
}
function collectResults(m){
  var rows=[],missing=[];
  document.querySelectorAll('tr[data-eid]').forEach(function(tr){
    var eid=tr.getAttribute('data-eid'),e=byId(m.entries,eid),pos=+tr.querySelector('.rpos').value;
    if(!pos){missing.push(eid);return}
    var r={eid:eid,pos:pos,kills:0};
    if(e.k==='p')r.kills=Math.max(0,+(tr.querySelector('.rk').value||0));
    else{r.mk={};tr.querySelectorAll('.rmk').forEach(function(i){var k=Math.max(0,+(i.value||0));r.mk[i.getAttribute('data-pid')]=k;r.kills+=k})}
    rows.push(r);
  });
  // unplaced entries go to the bottom in entry order
  var maxPos=rows.reduce(function(a,r){return Math.max(a,r.pos)},0);
  missing.forEach(function(eid){rows.push({eid:eid,pos:++maxPos,kills:0,mk:{}})});
  return rows;
}

/* ============ CRAZY: hype, XP & missions, live center, community ============ */
var AVATARS=['🐯','🦁','🐺','🦅','🐉','💀','👑','🔥','⚡','🎯','🥷','🤖','👻','🦂','🐍','🦈','🐼','😈'];
var FRAMES=[[1,'',''],[5,'#CD7F32','Bronze'],[10,'#C0C0C0','Silver'],[15,'#FFD700','Gold'],[20,'#7DF9FF','Diamond'],[30,'#FF4500','Inferno']];
function istDay(ts){return new Date((ts||now())+5.5*36e5).toISOString().slice(0,10)}
function weekStart(){var d=new Date(now()+5.5*36e5);var wd=(d.getUTCDay()+6)%7;d.setUTCHours(0,0,0,0);return d.getTime()-wd*864e5-5.5*36e5}
function myCheckins(pid){return (S.checkins||[]).filter(function(c){return c.pid===pid})}
function streakOf(pid){var days={};myCheckins(pid).forEach(function(c){days[c.day]=1});var n=0,t=now();if(!days[istDay(t)])t-=864e5;while(days[istDay(t)]){n++;t-=864e5}return n}
function mvpOf(m){var c={};(S.votes||[]).forEach(function(v){if(v.matchId===m.id)c[v.target]=(c[v.target]||0)+1});var best=null,bn=0;Object.keys(c).forEach(function(k){if(c[k]>bn){bn=c[k];best=k}});return best?{pid:best,votes:bn}:null}
function mvpCount(pid){var n=0;S.matches.forEach(function(m){if(m.status==='completed'){var x=mvpOf(m);if(x&&x.pid===pid)n++}});return n}
function weekProgress(pid,from,to){var s=pst(pid),r={m:0,k:0,top3:0,ci:0};
  s.hist.forEach(function(h){var m=M(h.m);if(!m||m.start<from||m.start>=to)return;r.m++;r.k+=h.k;if(h.pos<=3)r.top3++});
  myCheckins(pid).forEach(function(c){var t=Date.parse(c.day+'T00:00:00+05:30');if(t>=from&&t<to)r.ci++});return r}
function missionsFor(pid){var ws=weekStart(),p=weekProgress(pid,ws,ws+7*864e5);
  return [{k:'m_play',cur:p.m,goal:3,xp:50},{k:'m_kills',cur:p.k,goal:10,xp:50},{k:'m_top3',cur:p.top3,goal:1,xp:50},{k:'m_check',cur:p.ci,goal:5,xp:50}]}
function pastMissionXP(pid){var first=Infinity;pst(pid).hist.forEach(function(h){var m=M(h.m);if(m)first=Math.min(first,m.start)});myCheckins(pid).forEach(function(c){first=Math.min(first,Date.parse(c.day+'T00:00:00+05:30'))});
  if(first===Infinity)return 0;var xp=0,ws=weekStart();for(var w=ws;w+7*864e5>first;w-=7*864e5){var p=weekProgress(pid,w,w+7*864e5);xp+=(p.m>=3?50:0)+(p.k>=10?50:0)+(p.top3>=1?50:0)+(p.ci>=5?50:0)}return xp}
function xpOf(pid){var s=pst(pid);return s.m*20+s.kills*5+s.booyah*50+s.top3*15+myCheckins(pid).length*10+mvpCount(pid)*40+pastMissionXP(pid)}
function levelOf(xp){var lv=Math.floor(Math.sqrt(xp/40))+1,cur=Math.pow(lv-1,2)*40,nx=Math.pow(lv,2)*40;return {lv:lv,prog:(xp-cur)/(nx-cur),next:nx-xp}}
function frameOf(lv){var f=FRAMES[0];FRAMES.forEach(function(x){if(lv>=x[0])f=x});return f}
function founderNo(p){if(!p||p.role==='admin')return 0;var lim=+cfg('founderLimit',50)||50;var list=S.players.filter(function(x){return x.role!=='admin'}).sort(function(a,b){return a.created-b.created});var i=list.indexOf(p);return i>=0&&i<lim?i+1:0}
var REC_TIERS=[[3,'🎖','Recruiter'],[10,'🎖🎖','Squad Builder'],[25,'🏅','Legend Recruiter']];
function invitesOf(p){var all=S.players.filter(function(x){return x.invitedBy===p.id});return {joined:all.length,played:all.filter(function(x){return pst(x.id).m>0}).length}}
function recTier(n){var t0=null;REC_TIERS.forEach(function(x){if(n>=x[0])t0=x});return t0}
function inviteLink(p){return location.origin+location.pathname+'?ref='+encodeURIComponent(p.uid)}
function inviteCard(p){var iv=invitesOf(p),tr=recTier(iv.played),nx=null;REC_TIERS.forEach(function(x){if(!nx&&iv.played<x[0])nx=x});var link=inviteLink(p),msg=t('inviteMsg',{b:brandName(),l:link});
  return '<div class="card st" style="border-color:var(--acc)"><div class="row between"><b class="small">🔗 '+t('inviteTitle')+'</b>'+(tr?'<span class="tag t-acc">'+tr[1]+' '+tr[2]+'</span>':'')+'</div>'+
   '<div class="mono" style="word-break:break-all;background:var(--card2);padding:8px;border-radius:8px">'+esc(link)+'</div>'+
   '<div class="grid2"><button class="btn sec sm" data-copy="'+esc(link)+'">'+t('copy')+'</button><a class="btn sm" style="text-decoration:none;background:#25D366;color:#062" href="https://wa.me/?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">💬 '+t('shareInvite')+'</a></div>'+
   '<div class="row between small"><span>👥 '+iv.joined+' '+t('invJoined')+' · 🎮 '+iv.played+' '+t('invPlayed')+'</span>'+(nx?'<span class="tiny muted">'+t('nextRec',{n:nx[0]-iv.played,b:nx[2]})+'</span>':'')+'</div>'+
   (nx?'<div class="bar"><i style="width:'+Math.round(iv.played/nx[0]*100)+'%"></i></div>':'')+'<p class="tiny muted">'+t('inviteNote')+'</p></div>'}
function avHtml(p,size){if(!p)return '<div class="av">?</div>';var lv=levelOf(xpOf(p.id)).lv,f=frameOf(lv),sz=size||36;
  return '<div class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.5)+'px;'+(f[1]?'box-shadow:0 0 0 2px '+f[1]+',0 0 12px '+f[1]+'66;':'')+'">'+esc(p.avatar||p.ign.charAt(0).toUpperCase())+'</div>'}

/* ---- confetti + sound ---- */
function confetti(n){try{var c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90';document.body.appendChild(c);
  var w=c.width=innerWidth,h=c.height=innerHeight,x=c.getContext('2d'),cols=['#FF7A1A','#FFB020','#2BD67B','#5AA9FF','#B57CFF','#FF5A5F','#fff'],P=[];
  for(var i=0;i<(n||160);i++)P.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:4+Math.random()*5,c:cols[i%cols.length],a:Math.random()*6,s:(Math.random()-.5)*.3});
  var t0=performance.now();(function f(t){x.clearRect(0,0,w,h);P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});
    if(t-t0<2800)requestAnimationFrame(f);else c.remove()})(t0)}catch(e){}}
function fanfare(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var a=new A(),t=a.currentTime;[523,659,784,1047,784,1047].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.12);g.gain.exponentialRampToValueAtTime(.12,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.22);o.connect(g);g.connect(a.destination);o.start(t+i*.12);o.stop(t+i*.12+.25)})}catch(e){}}
function celebrateCheck(){var p=me();if(!p||isAdmin())return;PREF.celebrated=PREF.celebrated||{};
  S.matches.forEach(function(m){if(m.status!=='completed'||PREF.celebrated[m.id])return;var e=inMatch(m,p.id);if(!e)return;var r=m.results.filter(function(x){return x.eid===e.id})[0];
    PREF.celebrated[m.id]=1;savePref();if(r&&r.pos===1&&now()-m.start<3*864e5){setTimeout(function(){confetti(220);fanfare();toast('🏆 BOOYAH! '+m.title)},300)}})}

/* ---- share images ---- */
function cardCanvas(title,sub,stats,foot){var c=document.createElement('canvas');c.width=1080;c.height=1350;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#2A1208');g.addColorStop(.45,'#B33A0B');g.addColorStop(1,'#0E1117');x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.fillStyle='rgba(255,255,255,.06)';for(var i=0;i<14;i++){x.beginPath();x.arc(Math.random()*1080,Math.random()*1350,40+Math.random()*160,0,7);x.fill()}
  x.fillStyle='#FFB020';x.font='bold 44px Rajdhani, Inter, sans-serif';x.fillText(brandName().toUpperCase(),80,120);
  x.fillStyle='#fff';x.font='bold 112px Rajdhani, Inter, sans-serif';wrapText(x,title,80,300,920,116);
  x.fillStyle='rgba(255,255,255,.85)';x.font='600 46px Inter, sans-serif';x.fillText(sub,80,520);
  stats.forEach(function(s,i){var col=i%2,row=Math.floor(i/2),bx=80+col*470,by=600+row*200;x.fillStyle='rgba(0,0,0,.35)';roundRect(x,bx,by,440,170,28);x.fill();
    x.fillStyle='rgba(255,255,255,.7)';x.font='600 34px Inter, sans-serif';x.fillText(s[0],bx+32,by+58);x.fillStyle='#fff';x.font='bold 76px Rajdhani, Inter, sans-serif';x.fillText(String(s[1]),bx+32,by+140)});
  x.fillStyle='rgba(255,255,255,.8)';x.font='600 36px Inter, sans-serif';x.fillText(foot||'',80,1270);return c}
function wrapText(x,t,X,Y,maxW,lh){var w=String(t).split(' '),line='',y=Y;for(var i=0;i<w.length;i++){var test=line+w[i]+' ';if(x.measureText(test).width>maxW&&line){x.fillText(line,X,y);line=w[i]+' ';y+=lh}else line=test}x.fillText(line,X,y)}
function roundRect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function shareCanvas(c,name){var url=c.toDataURL('image/png'),bin=atob(url.split(',')[1]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  var blob=new Blob([arr],{type:'image/png'}),file;try{file=new File([blob],name,{type:'image/png'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:brandName()}).catch(function(){});return}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}catch(e){}
  modal('<h2>📸 '+esc(name)+'</h2><img src="'+url+'" style="width:100%;border-radius:14px" alt=""><p class="small muted">'+t('longPress')+'</p><button class="btn sec" data-a="mclose">'+t('close')+'</button>')}
function sharePlayerCard(){var p=me();if(!p)return;derive();var s=pst(p.id),lv=levelOf(xpOf(p.id));
  shareCanvas(cardCanvas(p.ign,tierOf(s.pts).name+' · Lv '+lv.lv+(frameOf(lv.lv)[2]?' · '+frameOf(lv.lv)[2]+' frame':''),[['Rating',s.rating],['Season pts',s.pts],['Kills',s.kills],['Booyah',s.booyah],['Matches',s.m],['MVP',mvpCount(p.id)]],'UID '+p.uid),'player-'+p.ign.replace(/\W+/g,'')+'.png')}
function shareMatchPoster(m){var top=m.results.slice().sort(function(a,b){return a.pos-b.pos}).slice(0,3);var mv=mvpOf(m);
  var stats=top.map(function(r){var e=byId(m.entries,r.eid);return ['#'+r.pos+' · '+r.kills+' kills',(e?entryName(e):'?').slice(0,14)]});if(mv){var mp=P(mv.pid);stats.push(['MVP',mp?mp.ign.slice(0,14):'?'])}

var LOGO_IMG=null;(function(){try{var im=new Image();im.onload=function(){LOGO_IMG=im};im.src='icons/icon-512.png'}catch(e){}})();
function siteLink(){return location.origin+location.pathname}
function enTime(ts){return new Date(ts).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function enDate(ts){return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function modeName(m){return m==='solo'?'Solo':m==='duo'?'Duo':'Squad'}
function tags(){return cfg('hashtags','#FreeFire #FreeFireIndia #FFTournament #CustomRoom #Esports #FreeTournament')}
function foundersLeft(){var lim=+cfg('founderLimit',50)||50,n=S.players.filter(function(x){return x.role!=='admin'}).length;return {left:Math.max(0,lim-n),limit:lim}}
function weeklyData(){derive();var ws=weekStart(),we=ws+7*864e5,pts={},kills={};
  S.matches.forEach(function(m){if(m.status!=='completed'||m.start<ws||m.start>=we)return;m.results.forEach(function(r){var e=byId(m.entries,r.eid);if(!e)return;entryPlayers(e).forEach(function(pid){pts[pid]=(pts[pid]||0)+r.pts;kills[pid]=(kills[pid]||0)+(e.k==='p'?r.kills:((r.mk&&r.mk[pid])||0))})})});
  function top(o,n){return Object.keys(o).map(function(k){return [k,o[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,n).map(function(x){var p=P(x[0]);return {ign:p?p.ign:'?',v:x[1]}})}
  var played=S.matches.filter(function(m){return m.status==='completed'&&m.start>=ws&&m.start<we}).length;
  return {from:ws,to:we-1,top:top(pts,3),frag:top(kills,1)[0]||null,matches:played}}

  x.strokeStyle='rgba(255,60,60,.25)';x.lineWidth=3;for(var i=0;i<6;i++){x.beginPath();x.moveTo(W*(.55+i*.08),0);x.lineTo(W*(.15+i*.08),H);x.stroke()}

  if(LOGO_IMG){try{x.save();x.beginPath();x.arc(70+80,top+80,80,0,7);x.clip();x.drawImage(LOGO_IMG,70,top,160,160);x.restore()}catch(e){}}

  y+=120;x.fillStyle='#fff';x.font='bold '+Math.round(96*sc)+'px Rajdhani, Inter, sans-serif';y=wrapLines(x,c.title,70,y+40,W-140,Math.round(100*sc),3);
  y+=30;(c.rows||[]).slice(0,6).forEach(function(r){x.fillStyle='rgba(0,0,0,.4)';roundRect(x,70,y,W-140,Math.round(104*sc),24);x.fill();
    x.font=Math.round(46*sc)+'px sans-serif';x.fillStyle='#fff';x.fillText(r[0],100,y+Math.round(68*sc));

function wrapLines(x,t,X,Y,maxW,lh,maxL){var w=String(t).split(' '),line='',y=Y,n=0;for(var i=0;i<w.length;i++){var test=line+w[i]+' ';if(x.measureText(test).width>maxW&&line){x.fillText(line,X,y);n++;line=w[i]+' ';y+=lh;if(n>=maxL-1){line=w.slice(i).join(' ');while(x.measureText(line+'…').width>maxW&&line.length>3)line=line.slice(0,-1);if(i<w.length-1||line!==w[i])line+=(line===w.slice(i).join(' ')?'':'…');break}}else line=test}x.fillText(line,X,y);return y+lh*.4}

   (PROMO.tab==='wa'?'<a class="btn" style="text-decoration:none;background:#25D366;color:#062" href="https://wa.me/?text='+encodeURIComponent(cap)+'" target="_blank" rel="noopener">💬 WhatsApp</a>':'<button class="btn sec" data-a="promoShareAll">📤 '+t('shareBoth')+'</button>')+'</div>'+

function promoFile(){var bin=atob(PROMO.url.split(',')[1]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);var name=(PROMO.type||'post')+'-'+PROMO.fmt+'.png';var blob=new Blob([arr],{type:'image/png'});var f=null;try{f=new File([blob],name,{type:'image/png'})}catch(e){}return {blob:blob,file:f,name:name}}

/* ============ SMART SUGGESTIONS: announcement texts, match & tournament names ============ */
var SUG_SEED={nm:0,ann:0,nt:0};
function pick(arr,seed,n){var out=[],L=arr.length;if(!L)return out;for(var i=0;i<L&&out.length<n;i++){var v=arr[(i+seed*n)%L];if(out.indexOf(v)<0)out.push(v)}return out}
function dayPart(ts){var h=new Date(ts).getHours();return h<5?'Midnight':h<12?'Morning':h<17?'Afternoon':h<20?'Evening':'Night'}
function weekday(ts){return new Date(ts).toLocaleDateString('en-IN',{weekday:'long'})}
function shortBrand(){var b=brandName();return b.length>14?b.split(' ')[0]:b}
function nameSugs(mode,ts,map){mode=mode||'squad';ts=ts||now();map=map||'Bermuda';
  var M=modeName(mode),dp=dayPart(ts),wd=weekday(ts),br=shortBrand(),n=S.matches.filter(function(m){return m.mode===mode}).length+1;
  var words=['Clash','Showdown','Rush','Royale','Knockout','Battle','Brawl','Frenzy','Warzone','Takedown'];
  var pats=[function(w){return dp+' '+M+' '+w+' #'+n},function(w){return wd+' '+M+' '+w},function(w){return map+' '+M+' '+w},function(w){return br+' '+M+' '+w+' #'+n}];
  var list=[];for(var pass=0;pass<4;pass++){words.forEach(function(w,i){list.push(pats[(i+pass)%4](w))})}
  list=list.concat([wd+' '+dp+' Fight Night',M+' Kill Race — '+map,br+' Daily '+M,'Rank Push '+M+' Lobby','Last Squad Standing'.replace('Squad',M),M+' Practice Scrim']);
  return list}
function tourneySugs(mode){var br=shortBrand(),M=modeName(mode||'squad'),s=S.settings.season||1,mon=new Date().toLocaleDateString('en-IN',{month:'long'});
  return [br+' '+M+' Cup S'+s,br+' Championship S'+s,mon+' '+M+' Masters','Bengal '+M+' League',br+' Weekend Warriors','Road to Champion — '+M,br+' Founders Cup','Kolkata '+M+' Clash']}
function annSugs(){var out=[],up=S.matches.filter(function(m){return matchStatus(m)==='upcoming'}).sort(function(a,b){return a.start-b.start}),rv=S.settings.reveal;
  if(up[0]){var m=up[0],left=Math.max(0,m.slots-m.entries.length);
    out.push('🔥 '+m.title+' starts '+enTime(m.start)+' — only '+left+' slot'+(left===1?'':'s')+' left! Join now in Matches.');
    out.push('🔑 Room ID for '+m.title+' unlocks '+rv+' min before start. Be online and ready!');
    out.push('⏰ Reminder: '+m.title+' ('+modeName(m.mode)+', '+m.map+') — '+enTime(m.start)+'. Don\'t be late, late players are not re-added.')}
  if(up[1])out.push('📅 Next up: '+up.slice(0,3).map(function(m){return m.title+' ('+enTime(m.start)+')'}).join(' · '));
  var last=S.matches.filter(function(m){return m.status==='completed'&&m.results.length}).sort(function(a,b){return b.start-a.start})[0];
  if(last){var w=last.results.slice().sort(function(a,b){return a.pos-b.pos})[0],we=w&&byId(last.entries,w.eid),mv=mvpOf(last),mp=mv&&P(mv.pid);
    out.push('🏆 Congrats '+(we?entryName(we):'the winners')+' for winning '+last.title+'!'+(mp?' ⭐ MVP: '+mp.ign+'.':'')+' GG everyone!');
    out.push('⭐ MVP voting is open for '+last.title+' — players from that match, vote now!')}
  var tr=S.tourneys.filter(function(x){return x.stages.length===1&&x.stages[0].start>now()}).slice(-1)[0];
  if(tr)out.push('🏆 '+tr.name+' registration is open ('+tr.stages[0].entrants.length+'/'+tr.slots+') — captains, register your team now!');
  var f=foundersLeft();if(f.left>0)out.push('🌟 Only '+f.left+' Founder spots left! Invite friends with your link in Profile and grab the badge.');
  out.push('🎯 Weekly missions reset on Monday — check in every day for +10 XP and keep your 🔥 streak!');
  out.push('🎬 Post your best clip in the Hub — the most-liked clip gets featured this week!');
  out.push('🔗 Bring your squad! 3 friends who play a match = 🎖 Recruiter badge.');
  out.push('⚠ Fair play: no hacks, no teaming, no emulators. Report cheaters with a video link — we check every report.');
  if(safeUrl(cfg('wa','')))out.push('💬 Join our WhatsApp group for room updates and match news (link on the Home screen).');
  return out}
function sugChips(list,field,which,n){var seed=SUG_SEED[which]||0,sel=pick(list,seed,n);

   '<div class="row wrap" style="gap:6px">'+sel.map(function(s){return '<button class="chip" style="white-space:normal;text-align:left;font-weight:600" data-a="sug" data-f="'+field+'" data-t="'+esc(s)+'">'+esc(s)+'</button>'}).join('')+'</div></div>'}

document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='nm_mode'||el.id==='nm_start'||el.id==='nm_map')refreshNameSug();

    loadTess().then(function(){return Tesseract.recognize(el.files[0],'eng')}).then(function(r){var txt=r.data.text||'';$('ocrText').value=txt;applyParsed(m,parseResultText(m,txt));st.textContent='✓'}).catch(function(){st.textContent=t('ocrFail')});

  return '<div class="card st"><b class="small">📲 '+t('install')+'</b>'+(deferredInstall?'<button class="btn" data-a="installApp">📲 '+t('installApp')+'</button>':'')+
   '<p class="small muted">'+t('installAndroid')+'<br>'+t('installIos')+'</p><p class="tiny muted">'+t('onlineNote')+'</p></div>';
}
async function boot(){
  NET='connecting';render();
  try{
    BOOT_ERR='';try{await libLoad()}catch(e){throw new Error('LIB: could not load the Supabase library from cdn.jsdelivr.net / unpkg.com (blocked network, ad-blocker or strict tracking protection?)')}
    if(!sb)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    var r=await sb.auth.getSession();if(r.error)throw new Error('AUTH: '+(r.error.message||r.error));
    SESSION=r.data.session;
    if(SESSION){try{await pull()}catch(e){throw new Error('DATA: '+((e&&(e.message||e.code))||e)+(e&&e.hint?' ('+e.hint+')':''))}}
    NET='ok';try{render()}catch(e){throw new Error('APP: '+(e&&e.message)+' @ '+String(e&&e.stack||'').split('\n')[1])}
    if(!boot.wired){boot.wired=1;
      sb.auth.onAuthStateChange(function(evt,sess){var was=SESSION&&SESSION.user.id;SESSION=sess;if(sess&&sess.user.id!==was){pull().then(function(){render();subscribe()}).catch(function(){NET='error';render()})}else if(!sess){render()}});
      setInterval(function(){if(SESSION&&!document.hidden)schedulePull()},60000);
    }
    if(SESSION)subscribe();
    if(isAdmin())runTemplates().then(function(n){if(n)schedulePull()}).catch(function(){});
  }catch(e){console.error(e);BOOT_ERR=String((e&&e.message)||e).slice(0,400);NET='error';render()}
}
function subscribe(){
  if(channel||!sb)return;
  try{channel=sb.channel('arena-all').on('postgres_changes',{event:'*',schema:'public'},function(pl){if(pl&&pl.table==='chat'){var cm=(pl.new&&pl.new.match_id)||(pl.old&&pl.old.match_id);if(openMatchId&&(!cm||cm===openMatchId))loadChat(openMatchId);return}schedulePull()}).subscribe()}catch(e){}
}
