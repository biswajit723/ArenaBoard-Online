<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#0E1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ArenaBoard" />
    <title>ArenaBoard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;800&family=Noto+Sans+Bengali:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e1117;
        --card: #161b24;
        --card2: #1d2430;
        --line: #283141;
        --ink: #eef2f7;
        --muted: #8e9aad;
        --acc: #ff7a1a;
        --acc2: #ffb020;
        --accBg: #2d1f12;
        --green: #2bd67b;
        --greenBg: #12291d;
        --red: #ff5a5f;
        --redBg: #2e1618;
        --blue: #5aa9ff;
        --blueBg: #13233a;
        --purple: #b57cff;
        --purpleBg: #24183a;
      }
      [data-theme='light'] {
        --bg: #f4f6fa;
        --card: #ffffff;
        --card2: #f1f4f9;
        --line: #e2e7ef;
        --ink: #141a23;
        --muted: #667385;
        --acc: #e8620a;
        --acc2: #c98500;
        --accBg: #fff0e3;
        --green: #12955a;
        --greenBg: #e4f6ec;
        --red: #d23b42;
        --redBg: #fdecee;
        --blue: #2c6fd1;
        --blueBg: #e8f0fc;
        --purple: #7b45d6;
        --purpleBg: #f1e9fd;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, 'Noto Sans Bengali', system-ui, -apple-system,
          Segoe UI, Roboto, sans-serif;
        font-size: 14.5px;
        line-height: 1.45;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .app {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 16px 100px;
        min-height: 100vh;
      }
      h1,
      h2,
      h3,
      .disp {
        font-family: Rajdhani, Inter, 'Noto Sans Bengali', sans-serif;
        margin: 0;
        letter-spacing: 0.2px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
      }
      h2 {
        font-size: 20px;
        font-weight: 700;
      }
      h3 {
        font-size: 16.5px;
        font-weight: 700;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12.5px;
      }
      .tiny {
        font-size: 11px;
      }
      .b {
        font-weight: 800;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .st {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
      }
      .card.click {
        cursor: pointer;
      }
      .card.click:active {
        transform: scale(0.995);
      }
      .btn {
        border: 0;
        border-radius: 11px;
        min-height: 42px;
        padding: 0 14px;
        background: var(--acc);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn.sec {
        background: var(--card2);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.ok {
        background: var(--green);
        color: #06150d;
      }
      .btn.no {
        background: var(--redBg);
        color: var(--red);
      }
      .btn.sm {
        min-height: 32px;
        padding: 0 10px;
        font-size: 12.5px;
        border-radius: 9px;
      }
      .btn.block {
        width: 100%;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      .chip.on {
        background: var(--acc);
        border-color: var(--acc);
        color: #fff;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        background: var(--card2);
        color: var(--muted);
        white-space: nowrap;
      }
      .t-acc {
        background: var(--accBg);
        color: var(--acc);
      }
      .t-g {
        background: var(--greenBg);
        color: var(--green);
      }
      .t-r {
        background: var(--redBg);
        color: var(--red);
      }
      .t-b {
        background: var(--blueBg);
        color: var(--blue);
      }
      .t-p {
        background: var(--purpleBg);
        color: var(--purple);
      }
      .hero {
        border-radius: 18px;
        padding: 16px;
        background: radial-gradient(
          120% 140% at 0% 0%,
          #ff7a1a 0%,
          #b33a0b 45%,
          #2a1208 100%
        );
        color: #fff;
        border: 0;
      }
      .hero .lbl {
        opacity: 0.8;
        font-size: 12px;
        font-weight: 700;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }
      .stat b {
        display: block;
        font-family: Rajdhani, sans-serif;
        font-size: 22px;
      }
      label.f {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 700;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--card2);
        border-radius: 10px;
        padding: 10px 11px;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--acc);
      }
      textarea {
        min-height: 80px;
        resize: vertical;
      }
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 20;
      }
      .tabs .in {
        display: flex;
        max-width: 760px;
        width: 100%;
      }
      .tab {
        flex: 1;
        border: 0;
        background: none;
        padding: 8px 0 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        position: relative;
      }
      .tab svg {
        width: 22px;
        height: 22px;
      }
      .tab.on {
        color: var(--acc);
      }
      .badge {
        position: absolute;
        top: 3px;
        left: calc(50% + 6px);
        background: var(--red);
        color: #fff;
        border-radius: 999px;
        font-size: 10px;
        padding: 0 5px;
        font-weight: 800;
      }
      .lr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .lr:last-child {
        border-bottom: 0;
      }
      .rank {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--card2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-family: Rajdhani, sans-serif;
        font-size: 16px;
        flex: none;
      }
      .r1 {
        background: linear-gradient(135deg, #ffd54a, #e39b00);
        color: #2a1a00;
      }
      .r2 {
        background: linear-gradient(135deg, #e5e9f0, #9aa5b5);
        color: #1a1f27;
      }
      .r3 {
        background: linear-gradient(135deg, #f0a36b, #a0522d);
        color: #2a1206;
      }
      .av {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: var(--accBg);
        color: var(--acc);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        flex: none;
      }
      .bar {
        height: 7px;
        background: var(--card2);
        border-radius: 99px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--acc), var(--acc2));
        border-radius: 99px;
      }
      .room {
        border: 1.5px dashed var(--acc);
        border-radius: 14px;
        padding: 12px;
        background: var(--accBg);
      }
      .room code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 50;
      }
      .modal {
        background: var(--card);
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        overflow: auto;
        border-radius: 20px 20px 0 0;
        padding: 18px;
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
        border: 1px solid var(--line);
      }
      @media (min-width: 640px) {
        .modal-bg {
          align-items: center;
        }
        .modal {
          border-radius: 20px;
        }
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 86px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        z-index: 70;
        max-width: 92vw;
        text-align: center;
      }
      .seg {
        display: flex;
        background: var(--card2);
        border-radius: 11px;
        padding: 3px;
        gap: 3px;
        border: 1px solid var(--line);
      }
      .seg button {
        flex: 1;
        border: 0;
        background: none;
        border-radius: 9px;
        padding: 7px 4px;
        font-weight: 800;
        font-size: 12.5px;
        color: var(--muted);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--acc);
        color: #fff;
      }
      .empty {
        text-align: center;
        padding: 22px 8px;
        color: var(--muted);
      }
      table.rt {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.rt th {
        text-align: left;
        color: var(--muted);
        font-weight: 700;
        padding: 6px 4px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
      }
      table.rt td {
        padding: 7px 4px;
        border-bottom: 1px solid var(--line);
      }
      table.rt input {
        padding: 6px;
        min-width: 0;
      }
      .cd {
        font-family: Rajdhani, sans-serif;
        font-weight: 700;
      }
      .live {
        animation: pulse 1.4s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      .hidden {
        display: none !important;
      }
      a {
        color: var(--acc);
      }
      .mono {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
      }
    </style>
  </head>

        function applyParsed(m, parsed) {
          var n = 0,
            order = {};
          Object.keys(parsed).forEach(function (pid) {
            var x = parsed[pid];
            var tr = document.querySelector('tr[data-eid="' + x.eid + '"]');
            if (!tr) return;
            var e = byId(m.entries, x.eid);
            if (e.k === 'p') {
              tr.querySelector('.rk').value = x.kills;
            } else {
              var inp = tr.querySelector('.rmk[data-pid="' + pid + '"]');
              if (inp) inp.value = x.kills;
            }
            var posIn = tr.querySelector('.rpos');
            if (x.pos) posIn.value = x.pos;
            else if (!order[x.eid]) {
              order[x.eid] = x.order;
            }
            n++;
          });
          // entries without explicit pos: rank by order of first appearance
          var noPos = Object.keys(order).sort(function (a, b) {
            return order[a] - order[b];
          });
          var used = {};
          document.querySelectorAll('.rpos').forEach(function (i) {
            if (i.value) used[i.value] = 1;
          });
          var next = 1;
          noPos.forEach(function (eid) {
            var tr = document.querySelector('tr[data-eid="' + eid + '"] .rpos');
            if (tr && !tr.value) {
              while (used[next]) next++;
              tr.value = next;
              used[next] = 1;
            }
          });
          toast(t('filled', { n: n }));
        }
        function collectResults(m) {
          var rows = [],
            missing = [];
          document.querySelectorAll('tr[data-eid]').forEach(function (tr) {
            var eid = tr.getAttribute('data-eid'),
              e = byId(m.entries, eid),
              pos = +tr.querySelector('.rpos').value;
            if (!pos) {
              missing.push(eid);
              return;
            }
            var r = { eid: eid, pos: pos, kills: 0 };
            if (e.k === 'p')
              r.kills = Math.max(0, +(tr.querySelector('.rk').value || 0));
            else {
              r.mk = {};
              tr.querySelectorAll('.rmk').forEach(function (i) {
                var k = Math.max(0, +(i.value || 0));
                r.mk[i.getAttribute('data-pid')] = k;
                r.kills += k;
              });
            }
            rows.push(r);
          });
          // unplaced entries go to the bottom in entry order
          var maxPos = rows.reduce(function (a, r) {
            return Math.max(a, r.pos);
          }, 0);
          missing.forEach(function (eid) {
            rows.push({ eid: eid, pos: ++maxPos, kills: 0, mk: {} });
          });
          return rows;
        }

                      id: trn.id,
                      name: trn.name,
                      mode: trn.mode,
                      slots: trn.slots,
                      prize: trn.prize,
                      sponsor: trn.sponsor,
                      gap: trn.gap,
                      finals_count: trn.finalsCount,
                      maps: trn.maps,
                      stages: [st0],
                    })
                );
                await q(sb.from('matches').insert(mrows));
              }, '✓').then(function (ok) {
                if (ok) openTourney(trn.id);
              });
              return;
            }
            case 'newTpl':
              tplForm();
              return;
            case 'createTpl': {
              var days = [];
              document.querySelectorAll('[data-day].on').forEach(function (b) {
                days.push(+b.dataset.day);
              });
              var tpr = {
                title: val('tp_t') || 'Daily match',
                mode: $('tp_mode').value,
                time: $('tp_time').value || '21:00',
                map: val('tp_map') || 'Bermuda',
                days: days,
                prize: val('tp_prize'),
                sponsor: '',
              };
              run(async function () {
                await q(sb.from('templates').insert(tpr));
                await pull();
                var n = await runTemplates();
                toast(t('generated', { n: n }));
              });
              return;
            }
            case 'postAnn': {
              var tx = val('annTxt');
              if (!tx) return;
              run(function () {
                return sb
                  .from('announcements')
                  .insert({ text: tx.slice(0, 500) });
              }, '✓');
              return;
            }
            case 'saveSettings': {
              var rv = +$('st_rev').value;
              if (!(rv >= 1 && rv <= 180)) {
                toast('⚠ ' + t('revealMins'));
                return;
              }
              run(function () {
                return sb
                  .from('app_settings')
                  .update({ reveal_min: rv })
                  .eq('id', 1);
              }, '✓');
              return;
            }
            case 'newSeason':
              confirmBox(t('seasonQ'), function () {
                derive();
                var top = S.players
                  .map(function (p) {
                    return [p.ign, pst(p.id).pts];
                  })
                  .sort(function (a, b) {
                    return b[1] - a[1];
                  })
                  .slice(0, 3)
                  .map(function (x) {
                    return x[0] + ' (' + x[1] + ')';
                  });
                var arch = (S.archive || []).concat([
                  { season: S.settings.season, top: top, ts: now() },
                ]);
                run(function () {
                  return sb
                    .from('app_settings')
                    .update({ season: S.settings.season + 1, archive: arch })
                    .eq('id', 1);
                }, '✓');
              });
              return;
            case 'export': {
              var json = JSON.stringify(S);
              modal(
                '<h2>' +
                  t('exportB') +
                  '</h2><textarea id="exTa" rows="7" class="mono" readonly>' +
                  esc(json) +
                  '</textarea><div class="grid2"><button class="btn sec" data-a="mclose">' +
                  t('close') +
                  '</button><button class="btn" data-copy-ta="exTa">' +
                  t('copy') +
                  '</button></div>'
              );
              return;
            }
          }
        });
        document.addEventListener('change', function (ev) {
          var el = ev.target;
          if (el.id === 'ocrFile' && el.files[0] && openMatchId) {
            var m = M(openMatchId),
              st = $('ocrStatus');
            st.textContent = t('ocrLoading');
            loadTess()
              .then(function () {
                return Tesseract.recognize(el.files[0], 'eng');
              })
              .then(function (r) {
                var txt = r.data.text || '';
                $('ocrText').value = txt;
                applyParsed(m, parseResultText(m, txt));
                st.textContent = '✓';
              })
              .catch(function () {
                st.textContent = t('ocrFail');
              });
          }
        });
        window.addEventListener('hashchange', function () {
          var h = location.hash.slice(1);
          var tabs = isAdmin() ? ADMIN_TABS : PLAYER_TABS;
          if (tabs.indexOf(h) >= 0 && h !== view) {
            view = h;
            render();
          }
        });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) schedulePull();
        });

        /* openMatch tracks id so results modal OCR knows the match */
        var _rf = resultsForm;
        resultsForm = function (m) {
          openMatchId = m.id;
          _rf(m);
        };

        /* back handling for the Android wrapper */
        window.__ABONLINE = 1;
        window.__AB = {
          back: function () {
            if ($('layer').innerHTML) {
              closeModal();
              return true;
            }
            var first = isAdmin() ? 'dash' : 'home';
            if (view !== first) {
              view = first;
              render();
              return true;
            }
            return false;
          },
          get S() {
            return S;
          },
          parse: function (mid, txt) {
            return parseResultText(M(mid), txt);
          },
          derive: function () {
            return derive();
          },
          publish: function (mid, rows) {
            return publishResults(M(mid), rows);
          },
          advance: function (id) {
            advanceTourney(TR(id));
          },
          stand: function (id, si) {
            return tourneyStandings(TR(id), si);
          },
          runTemplates: runTemplates,
        };

        var h0 = location.hash.slice(1);
        if (PLAYER_TABS.concat(ADMIN_TABS).indexOf(h0) >= 0) view = h0;
        var channel = null;
        async function boot() {
          NET = 'connecting';
          render();
          try {
            await libLoad();
            if (!sb)
              sb = window.supabase.createClient(SB_URL, SB_KEY, {
                auth: {
                  persistSession: true,
                  autoRefreshToken: true,
                  detectSessionInUrl: false,
                },
              });
            var r = await sb.auth.getSession();
            if (r.error) throw r.error;
            SESSION = r.data.session;
            if (SESSION) await pull();
            NET = 'ok';
            render();
            if (!boot.wired) {
              boot.wired = 1;
              sb.auth.onAuthStateChange(function (evt, sess) {
                var was = SESSION && SESSION.user.id;
                SESSION = sess;
                if (sess && sess.user.id !== was) {
                  pull()
                    .then(function () {
                      render();
                      subscribe();
                    })
                    .catch(function () {
                      NET = 'error';
                      render();
                    });
                } else if (!sess) {
                  render();
                }
              });
              setInterval(function () {
                if (SESSION && !document.hidden) schedulePull();
              }, 60000);
            }
            if (SESSION) subscribe();
            if (isAdmin())
              runTemplates()
                .then(function (n) {
                  if (n) schedulePull();
                })
                .catch(function () {});
          } catch (e) {
            console.error(e);
            NET = 'error';
            render();
          }
        }
        function subscribe() {
          if (channel || !sb) return;
          try {
            channel = sb
              .channel('arena-all')
              .on(
                'postgres_changes',
                { event: '*', schema: 'public' },
                function () {
                  schedulePull();
                }
              )
              .subscribe();
          } catch (e) {}
        }
        boot();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
